<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- bench/fonts.conf without the substitution rules of /etc/fonts/conf.d.
     wkhtmltopdf 0.12.6's Qt only takes a font whose family is installed, and
     uses its default font for any other family; without the rules, Chromium
     does not accept Liberation Serif for "Times New Roman" either, and falls
     back to the generic family that the bench sets to the same default. -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <dir>/usr/share/fonts/truetype/liberation2</dir>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>

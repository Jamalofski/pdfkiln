<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fonts seen by both engines during the bench (FONTCONFIG_FILE), so that
     results do not depend on what else is installed: Liberation (metric
     compatible with Arial, Helvetica, Times and Courier) and DejaVu, the
     defaults of Debian and Ubuntu. Packages: fonts-liberation, fonts-dejavu-core. -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <dir>/usr/share/fonts/truetype/liberation2</dir>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <!-- Aliases (Helvetica to Liberation Sans...) and the sans-serif default. -->
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
</fontconfig>

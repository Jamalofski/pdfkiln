name: chromium

# By hand, before a pdfkiln version: when Chrome for Testing has a newer
# Stable, a pull request moves the pin (chromium.json, src/version.ts).
# Chromium only changes with a new pdfkiln version; CI, merging and
# publishing are started by hand too.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - id: pin
        run: echo "version=$(node dist/scripts/update-chromium.js)" >> "$GITHUB_OUTPUT"

      # A branch already pushed for this version means a pull request is
      # open or was closed on purpose: nothing to do.
      - if: steps.pin.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          branch="chromium/$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch exists"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "Chromium $VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Chromium $VERSION" \
            --body "chrome-headless-shell $VERSION, Stable channel of Chrome for Testing: sizes and SHA-256 of every archive in chromium.json. Opened by .github/workflows/chromium.yml."
